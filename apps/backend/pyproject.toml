[project]
name = "moe-backend"
version = "1.0.0"
description = "Handwritten Script OCR POC Backend"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "python-multipart>=0.0.9",
    "uvicorn>=0.34",
    "opencv-python>=4.10",
    "numpy>=1.26",
    "pillow>=10.3",
    "PyMuPDF>=1.24",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[tool.uv]
dev-dependencies = [
    "mypy>=1.0",
]
